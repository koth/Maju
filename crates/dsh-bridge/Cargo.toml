[package]
name = "dsh-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
acp-core = { path = "../acp-core" }
anyhow.workspace = true
bytes.workspace = true
dashmap = "6"
dirs-next = "2.0"
futures.workspace = true
serde_yaml = "0.9"
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util"] }
tracing = "0.1"
uuid.workspace = true
url = "2"
workspace-model = { path = "../workspace-model" }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

# SIGTERM/SIGKILL for the Unix graceful-then-force child kill and the orphan
# reap (dsh web children have no stdin-EOF shutdown for the `web` command, so
# reaping must target processes the app can no longer `wait` on).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
